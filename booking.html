<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Servis - FDN Performance Tuner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body class="bg-light text-dark">
    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        <div class="card bg-white border-0 shadow w-100" style="max-width: 500px;">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <h2 class="text-dark fw-bold mb-1">RR X FDN Dyno</h2>
                    <p class="text-secondary">Pesan jadwal servismu!</p>
                </div>
                
                <form id="bookingForm">
                    <div class="mb-3">
                        <label for="nama" class="form-label text-dark fw-medium">Nama Lengkap</label>
                        <input type="text" class="form-control focus-dark" id="nama" name="nama" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="whatsapp" class="form-label text-dark fw-medium">Nomor WhatsApp</label>
                        <input type="tel" class="form-control focus-dark" id="whatsapp" name="whatsapp" required>
                    </div>

                    <div class="mb-3">
                        <label for="brand" class="form-label text-dark fw-medium">Brand Motor</label>
                        <select class="form-select focus-dark" id="brand" name="brand" required>
                            <option value="" disabled selected>Pilih brand...</option>
                            <option value="Honda">Honda</option>
                            <option value="Yamaha">Yamaha</option>
                            <option value="Suzuki">Suzuki</option>
                            <option value="Kawasaki">Kawasaki</option>
                        </select>
                    </div>

                    <div class="mb-3 d-none" id="wrapTipe">
                        <label for="tipe" class="form-label text-dark fw-medium">Tipe Motor</label>
                        <select class="form-select focus-dark" id="tipe" name="tipe" required>
                            <option value="" disabled selected>Pilih tipe...</option>
                        </select>
                    </div>

                    <div class="mb-3 d-none" id="wrapModel">
                        <label for="model" class="form-label text-dark fw-medium">Nama Motor</label>
                        <select class="form-select focus-dark" id="model" name="model" required>
                            <option value="" disabled selected>Pilih motor...</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="layanan" class="form-label text-dark fw-medium">Pilih Layanan</label>
                        <select class="form-select focus-dark" id="layanan" name="layanan" required>
                            <option value="" disabled selected>Pilih layanan...</option>
                            <option value="Servis Harian">Servis Harian</option>
                            <option value="Modifikasi / Remap">Modifikasi / Remap</option>
                            <option value="Bongkar Total">Bongkar Total</option>
                            <option value="Cek Kerusakan">Kerusakan belum diketahui</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="tanggal" class="form-label text-dark fw-medium">Tanggal</label>
                        <input type="date" class="form-control focus-dark" id="tanggal" name="tanggal" required onclick="this.showPicker()">
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-dark fw-medium">Pilih Jam</label>
                        <div id="timeSlots" class="row g-2"></div>
                        <input type="hidden" name="jam" id="jam" required>
                    </div>
                    
                    <button type="submit" id="btnSubmit" class="btn btn-dark w-100 fw-bold py-2" disabled>Kirim Booking</button>
                    <div id="status" class="text-center mt-3 fw-medium"></div>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
